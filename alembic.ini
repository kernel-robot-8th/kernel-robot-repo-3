[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# 위 경로 목록을 나누는 문자(os.pathsep). 적지 않으면 alembic 1.16부터 실행할 때마다 DeprecationWarning을 낸다.
path_separator = os
sqlalchemy.url = sqlite:///data/tasks.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
